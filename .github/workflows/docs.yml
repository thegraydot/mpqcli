name: docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'book.toml'
      - 'Makefile'
      - '.github/workflows/docs.yml'

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

env:
  MDBOOK_VERSION: 0.5.4
  MDBOOK_MERMAID_VERSION: 0.17.1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install docs tools
        run: |
          mkdir -p "$HOME/.local/bin"
          MDBOOK_URL="https://github.com/rust-lang/mdBook/releases/download"
          curl -sSL "$MDBOOK_URL/v$MDBOOK_VERSION/mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --directory="$HOME/.local/bin"
          MERMAID_URL="https://github.com/badboy/mdbook-mermaid/releases/download"
          curl -sSL "$MERMAID_URL/v$MDBOOK_MERMAID_VERSION/mdbook-mermaid-v$MDBOOK_MERMAID_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --directory="$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build docs
        run: make docs_build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: book/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
