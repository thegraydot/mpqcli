name: Main

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/**"
      - "Makefile"
      - ".clang-format"
      - ".clang-tidy"
      - "src/**"
      - "app/**"
      - "cmake/**"
      - "completion/**"
      - "extern/**"
      - "test/**"
      - "CMakeLists.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".gpipe.yml"

# Never cancel on main. The prerelease job deletes the dev release, recreates
# its tag and pushes the image; a run cancelled part-way through leaves those
# three disagreeing with each other, which costs more than the runner minutes
# cancelling would save.
concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml
  build:
    uses: ./.github/workflows/build.yml
    with:
      artifacts: true
  prerelease:
    uses: ./.github/workflows/prerelease.yml
    needs: [build, lint, test]
    permissions:
      contents: write
      packages: write
