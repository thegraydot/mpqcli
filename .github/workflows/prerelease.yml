name: Prerelease

on:
  workflow_call

permissions:
  contents: write
  packages: write

jobs:
  prerelease_binaries:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all build artefacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Delete any existing dev release
        run: |
          if err=$(gh release view dev 2>&1 >/dev/null); then
            gh release delete dev --yes --cleanup-tag
          elif grep -qi "release not found" <<<"$err"; then
            echo "No existing dev release"
          else
            echo "::error::could not determine whether a dev release exists: ${err}"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --target pins the tag to the commit that was built rather than to whatever
      # main points at by the time this job runs
      - name: Create prerelease
        run: |
          gh release create dev \
            --target "${GITHUB_SHA}" \
            --title "Dev (Pre-release)" \
            --prerelease \
            --notes "**Commit:** ${GITHUB_SHA}" \
            dist/mpqcli-linux-x86_64 \
            dist/mpqcli-linux-aarch64 \
            dist/mpqcli-windows-x86_64.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prerelease_docker:
    needs: prerelease_binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Download Docker image artefact
        uses: actions/download-artifact@v8
        with:
          name: mpqcli-docker

      - name: Load Docker image
        run: |
          docker load -i mpqcli-docker.tar

      # dev only, never latest: latest tracks releases, so pointing it at a
      # rolling build makes an untagged docker pull return whatever last landed
      # on main
      - name: Push dev tag to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag mpqcli "$IMAGE:dev"
          docker push "$IMAGE:dev"
