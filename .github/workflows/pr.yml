name: Pull Request

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Makefile"
      - ".clang-format"
      - ".clang-tidy"
      - "src/**"
      - "app/**"
      - "cmake/**"
      - "completion/**"
      - "extern/**"
      - "test/**"
      - "CMakeLists.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".gpipe.yml"

# Grouped by pull request number, so a push only ever supersedes an earlier run of
# its own branch and never one somebody else is waiting on
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
  lint:
    uses: ./.github/workflows/lint.yml
    needs: build
  test:
    uses: ./.github/workflows/test.yml
    needs: build
