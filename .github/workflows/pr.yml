name: Pull Request

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".clang-format"
      - ".clang-tidy"
      - "src/**"
      - "app/**"
      - "cmake/**"
      - "completion/**"
      - "extern/**"
      - "test/**"
      - "CMakeLists.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".gpipe.yml"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
  lint:
    uses: ./.github/workflows/lint.yml
    needs: build
  test:
    uses: ./.github/workflows/test.yml
    needs: build
