name: Pull Request

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Makefile"
      - ".clang-format"
      - ".clang-tidy"
      - "src/**"
      - "app/**"
      - "cmake/**"
      - "completion/**"
      - "extern/**"
      - "test/**"
      - "CMakeLists.txt"
      - "Dockerfile"
      - "scripts/run_valgrind_tests.sh"
      - ".dockerignore"
      - ".gpipe.yml"

# Grouped by pull request number, so a push only ever supersedes an earlier run of
# its own branch and never one somebody else is waiting on
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# No needs between the jobs: lint configures its own tree, test and valgrind build what they
# run, and nothing reads build's artefacts until a release
jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml
  build:
    uses: ./.github/workflows/build.yml
  valgrind:
    uses: ./.github/workflows/valgrind.yml
    permissions:
      contents: read
      pull-requests: write
