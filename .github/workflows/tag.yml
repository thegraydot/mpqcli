name: Tag and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml
  build:
    uses: ./.github/workflows/build.yml
    with:
      artifacts: true
  release:
    uses: ./.github/workflows/release.yml
    needs: [build, lint, test]
    permissions:
      contents: write
      packages: write
      id-token: write
