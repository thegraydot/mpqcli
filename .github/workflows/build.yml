name: Build

on:
  workflow_call

jobs:
  build_linux:
    strategy:
      matrix:
        include:
          # AMD64 builds on ubuntu-24.04
          - arch: amd64
            asset: mpqcli-linux-x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
          # ARM64 builds on ubuntu-24.04-arm
          - arch: arm64
            asset: mpqcli-linux-aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build Docker image (${{ matrix.arch }})
        run: |
          docker build --platform ${{ matrix.platform }} -t mpqcli-${{ matrix.arch }} .

      - name: Extract binary from Docker image
        run: |
          # Create a temporary container from the image
          CONTAINER_ID=$(docker create mpqcli-${{ matrix.arch }})
          # Copy the binary from the container
          docker cp $CONTAINER_ID:/mpqcli ./${{ matrix.asset }}
          # Clean up the container
          docker rm $CONTAINER_ID

      - name: Verify binary
        run: |
          file ./${{ matrix.asset }}
          echo "Binary created: ${{ matrix.asset }}"

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 1

  build_windows:
    runs-on: windows-2022
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Run cmake
        shell: bash
        run: |
          cmake -B build \
          -G "Visual Studio 17 2022" \
          -A x64 \
          -DMPQCLI_BUILD_APP=ON

      - name: Compile project
        run: cmake --build build --config Release

      - name: Check mpqcli version
        run: build/bin/Release/mpqcli.exe version

      - name: Copy mpqcli binary
        run: cp build/bin/Release/mpqcli.exe build/bin/mpqcli-windows-x86_64.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mpqcli-windows-x86_64.exe
          path: build/bin/mpqcli-windows-x86_64.exe
          retention-days: 1

  build_docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build Docker image (AMD64)
        run: |
          docker build --platform linux/amd64 -t mpqcli .

      - name: Save Docker image as a tar file
        run: |
          docker save mpqcli -o mpqcli-docker.tar

      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v7
        with:
          name: mpqcli-docker
          path: mpqcli-docker.tar
          retention-days: 1
