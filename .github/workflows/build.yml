name: Build

on:
  workflow_call:
    inputs:
      artifacts:
        description: Build the full release artefact set, not just the cheap subset
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build_linux:
    strategy:
      # Report both architectures independently; one failing says nothing about
      # the other, and cancelling hides half the answer
      fail-fast: false
      matrix:
        include:
          # AMD64 builds on ubuntu-24.04
          - arch: amd64
            asset: mpqcli-linux-x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
          # ARM64 builds on ubuntu-24.04-arm
          - arch: arm64
            asset: mpqcli-linux-aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build Docker image (${{ matrix.arch }})
        run: |
          docker build --platform ${{ matrix.platform }} -t mpqcli-${{ matrix.arch }} .

      - name: Extract binary from Docker image
        run: |
          CONTAINER_ID=$(docker create mpqcli-${{ matrix.arch }})
          docker cp $CONTAINER_ID:/mpqcli ./${{ matrix.asset }}
          docker rm $CONTAINER_ID

      # Run the bytes that will ship: a static binary missing its loader builds
      # without complaint and only fails here
      - name: Smoke-run the artefact
        run: |
          chmod +x ./${{ matrix.asset }}
          ./${{ matrix.asset }} version

      - name: Upload binary as artefact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 1

      # The amd64 image is the one published. Saving it here rather than
      # rebuilding it in a job of its own means release and prerelease push
      # exactly the bytes this job smoke-ran. Only they consume it, so a pull
      # request skips the save.
      - name: Save Docker image as a tar file
        if: matrix.arch == 'amd64' && inputs.artifacts
        run: |
          docker tag mpqcli-${{ matrix.arch }} mpqcli
          docker save mpqcli -o mpqcli-docker.tar

      - name: Upload Docker image as artefact
        if: matrix.arch == 'amd64' && inputs.artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mpqcli-docker
          path: mpqcli-docker.tar
          retention-days: 1

  # Gated on the full artefact set: test.yml already compiles this platform, so
  # a pull request learns nothing from a second Windows build, and the runner
  # bills at twice a Linux one
  build_windows:
    if: inputs.artifacts
    runs-on: windows-2022
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          submodules: true

      # Raw cmake rather than make: the Makefile needs a POSIX shell, and the
      # shipped build gets its own tree rather than the everyday build/dev
      - name: Build
        shell: bash
        run: |
          cmake -B build/release -G "Visual Studio 17 2022" -A x64 -DMPQCLI_BUILD_APP=ON
          cmake --build build/release --config Release
          mv build/release/bin/mpqcli.exe ./mpqcli-windows-x86_64.exe

      - name: Smoke-run the artefact
        shell: bash
        run: ./mpqcli-windows-x86_64.exe version

      - name: Upload binary as artefact
        uses: actions/upload-artifact@v7
        with:
          name: mpqcli-windows-x86_64.exe
          path: mpqcli-windows-x86_64.exe
          retention-days: 1
