name: Release

on:
  workflow_call

# id-token: write obtains the OIDC token gpipe uses for cosign keyless signing
permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release_binaries:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Default depth. Nothing here reads git history: get_changelog reads
      # CHANGELOG.md from the working tree, and gh release create uses the API.
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve release version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          project_version="$(make get_version)"
          if [ "$version" != "$project_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the project version ${project_version} in CMakeLists.txt"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download all build artefacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        run: make get_changelog TAG="${GITHUB_REF_NAME}" > /tmp/release-notes.md

      - uses: thomaslaurenson/gpipe@v1
        with:
          cosign_sign: true

      # Name every asset. A dist/mpqcli-* glob is shorter and wrong: with
      # merge-multiple every artefact lands flat in dist/, so the Docker image
      # tar matches too and is attached to the release as if it were a binary.
      - name: Release package
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            dist/mpqcli-linux-x86_64 \
            dist/mpqcli-linux-aarch64 \
            dist/mpqcli-windows-x86_64.exe \
            install.sh install.ps1 \
            checksums.txt checksums.txt.sigstore.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gated on the release: a registry outage then leaves a complete release with
  # no image, rather than an image with no release
  release_docker:
    needs: release_binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Download Docker image artefact
        uses: actions/download-artifact@v8
        with:
          name: mpqcli-docker

      - name: Load Docker image
        run: |
          docker load -i mpqcli-docker.tar

      - name: Push to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.release_binaries.outputs.version }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag mpqcli "$IMAGE:$VERSION"
          docker tag mpqcli "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
