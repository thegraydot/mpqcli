name: Release

on:
  workflow_call

permissions:
  contents: write
  packages: write

jobs:
  release_binaries:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve release version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          project_version="$(make get_version)"
          if [ "$version" != "$project_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the project version ${project_version} in CMakeLists.txt"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download all build artefacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract changelog for this tag
        id: changelog
        run: |
          {
            echo "content<<EOF"
            make get_changelog TAG="${{ steps.version.outputs.version }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Release package
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --notes "$CHANGELOG_CONTENT" \
            dist/mpqcli-linux-x86_64 \
            dist/mpqcli-linux-aarch64 \
            dist/mpqcli-windows-x86_64.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_CONTENT: ${{ steps.changelog.outputs.content }}

  release_docker:
    needs: release_binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: mpqcli-docker

      - name: Load Docker image
        run: |
          docker load -i mpqcli-docker.tar

      - name: Tag Docker image with version
        run: |
          docker tag mpqcli ghcr.io/thegraydot/mpqcli:${{ needs.release_binaries.outputs.version }}
          docker tag mpqcli ghcr.io/thegraydot/mpqcli:latest

      - name: Push Docker image to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/thegraydot/mpqcli:${{ needs.release_binaries.outputs.version }}
          docker push ghcr.io/thegraydot/mpqcli:latest
