name: Lint

on:
  workflow_call

permissions:
  contents: read

jobs:
  lint_cpp:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install clang tools
        run: sudo apt-get install -y clang-18 clang-format-18 clang-tidy-18

      - run: make check_all
