name: Test

on:
  workflow_call

permissions:
  contents: read

jobs:
  test_linux:
    name: test_linux (${{ matrix.compiler }}, ${{ matrix.build_type }}, ${{ matrix.arch }})
    strategy:
      # Report every entry independently. Cancelling one on another's failure
      # hides half the findings on exactly the runs where they matter.
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
            build_type: Debug
            arch: amd64
            runner: ubuntu-24.04
          # Release paired with one compiler rather than a third amd64 job: NDEBUG
          # and the optimiser are what ships, and nothing else exercises them
          - compiler: clang
            cxx: clang++-18
            build_type: Release
            arch: amd64
            runner: ubuntu-24.04
          # build.yml ships an arm64 binary, so arm64 is tested natively as well
          - compiler: gcc
            cxx: g++
            build_type: Release
            arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    # BUILD_TYPE goes in the environment, not on the configure line: build re-runs
    # configure through its prerequisite chain, and an invocation without it would
    # reset the cache to the Debug default, so the Release entries would quietly
    # test Debug and report green
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install clang
        if: matrix.compiler == 'clang'
        run: sudo apt-get install -y clang-18

      - run: make configure CMAKE_ARGS="-DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DMPQCLI_WERROR=ON"
      - run: make build

      # Separate steps, so a failure names the layer that broke
      - run: make test
      - run: make test_functional

  test_windows:
    name: test_windows (${{ matrix.build_type }})
    strategy:
      fail-fast: false
      matrix:
        # Debug as well as Release: MSVC's Debug runtime adds checked iterators
        # and CRT assertions that Release compiles out
        build_type: [Debug, Release]

    runs-on: windows-2022
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: true

      # Raw cmake: the Makefile needs a POSIX shell. MPQCLI_WERROR holds MSVC to
      # the same bar as the Linux jobs: /W4 /permissive- with warnings as errors.
      - name: Configure and build
        shell: bash
        run: |
          cmake -B build/dev -G "Visual Studio 17 2022" -A x64 -DMPQCLI_BUILD_APP=ON -DMPQCLI_WERROR=ON
          cmake --build build/dev --config ${{ matrix.build_type }} --parallel

      # Separate steps, so a failure names the layer that broke
      - name: Run unit tests
        shell: bash
        run: ctest --test-dir build/dev --output-on-failure -C ${{ matrix.build_type }} -L unit

      - name: Run functional tests
        shell: bash
        run: ctest --test-dir build/dev --output-on-failure -C ${{ matrix.build_type }} -L functional
